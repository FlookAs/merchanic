services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: merchanic
      POSTGRES_PASSWORD: merchanic
      POSTGRES_DB: merchanic
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./apps/backend
    restart: unless-stopped
    env_file:
      - ./apps/backend/.env
    ports:
      - "3000:3000"
    depends_on:
      - postgres

volumes:
  pgdata: